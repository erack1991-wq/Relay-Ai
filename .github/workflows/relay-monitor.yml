name: Relay live monitor

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production readiness endpoint with bounded retries
        env:
          RELAY_HEALTH_URL: https://relay-business-workspace.epeazy2.chatgpt.site/api/health
        run: node scripts/monitor-health.mjs
